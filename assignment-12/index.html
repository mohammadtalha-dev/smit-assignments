<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">
      <i class="fa-solid fa-bars"></i>
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube">
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Search">
      <button><i class="fa-solid fa-magnifying-glass"></i></button>
      <i class="fa-solid fa-microphone mic-icon"></i>
    </div>
    <div class="header-icons">
      <i class="fa-solid fa-video"></i>
      <i class="fa-solid fa-bell"></i>
      <i class="fa-solid fa-circle-user"></i>
    </div>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <ul>
        <li class="active"><i class="fa-solid fa-house"></i> Home</li>
        <li><i class="fa-regular fa-compass"></i> Explore</li>
        <li><i class="fa-solid fa-tv"></i> Subscriptions</li>
        <hr>
        <li><i class="fa-solid fa-box-archive"></i> Library</li>
        <li><i class="fa-solid fa-clock-rotate-left"></i> History</li>
        <li><i class="fa-regular fa-clock"></i> Watch Later</li>
        <li><i class="fa-regular fa-thumbs-up"></i> Liked Videos</li>
        <li><i class="fa-solid fa-music"></i> Music</li>
        <li><i class="fa-solid fa-gamepad"></i> Gaming</li>
        <li><i class="fa-solid fa-newspaper"></i> News</li>
        <li><i class="fa-solid fa-trophy"></i> Sports</li>
        <li><i class="fa-solid fa-lightbulb"></i> Learning</li>
        <li><i class="fa-solid fa-shirt"></i> Fashion</li>
        <li><i class="fa-solid fa-podcast"></i> Podcasts</li>
      </ul>
    </aside>

    <main class="content">
      <div class="categories">
        <button class="active">All</button>
        <button>Music</button>
        <button>Mixes</button>
        <button>User interface design</button>
        <button>Graphic design</button>
        <button>Computer Science</button>
      </div>

      <div class="video-grid">
        <div class="video-card"><img src="https://picsum.photos/600/350?random=1" alt="thumbnail"></div>
        <div class="video-card"><img src="https://picsum.photos/600/350?random=2" alt="thumbnail"></div>
        <div class="video-card"><img src="https://picsum.photos/600/350?random=3" alt="thumbnail"></div>
        <div class="video-card"><img src="https://picsum.photos/600/350?random=4" alt="thumbnail"></div>
        <div class="video-card"><img src="https://picsum.photos/600/350?random=5" alt="thumbnail"></div>
        <div class="video-card"><img src="https://picsum.photos/600/350?random=6" alt="thumbnail"></div>
        <div class="video-card"><img src="https://picsum.photos/600/350?random=7" alt="thumbnail"></div>
        <div class="video-card"><img src="https://picsum.photos/600/350?random=8" alt="thumbnail"></div>
        <div class="video-card"><img src="https://picsum.photos/600/350?random=9" alt="thumbnail"></div>
        <div class="video-card"><img src="https://picsum.photos/600/350?random=10" alt="thumbnail"></div>
        <div class="video-card"><img src="https://picsum.photos/600/350?random=11" alt="thumbnail"></div>
        <div class="video-card"><img src="https://picsum.photos/600/350?random=12" alt="thumbnail"></div>
      </div>
    </main>
  </div>

</body>
  </html>
