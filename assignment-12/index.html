<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Clone</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">

<div class="logo">
<i class="fa-solid fa-bars"></i>
<img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube">
</div>

<div class="search-bar">
<input type="text" placeholder="Search">
<button><i class="fa-solid fa-magnifying-glass"></i></button>
<i class="fa-solid fa-microphone mic-icon"></i>
</div>

<div class="header-icons">
<i class="fa-solid fa-video"></i>
<i class="fa-solid fa-bell"></i>
<i class="fa-solid fa-circle-user"></i>
</div>

</header>

<div class="main-container">

<aside class="sidebar">
<ul>
<li class="active"><i class="fa-solid fa-house"></i> Home</li>
<li><i class="fa-regular fa-compass"></i> Explore</li>
<li><i class="fa-solid fa-tv"></i> Subscriptions</li>
<hr>
<li><i class="fa-solid fa-box-archive"></i> Library</li>
<li><i class="fa-solid fa-clock-rotate-left"></i> History</li>
<li><i class="fa-regular fa-clock"></i> Watch Later</li>
<li><i class="fa-regular fa-thumbs-up"></i> Liked Videos</li>
<li><i class="fa-solid fa-music"></i> Music</li>
<li><i class="fa-solid fa-gamepad"></i> Gaming</li>
<li><i class="fa-solid fa-newspaper"></i> News</li>
<li><i class="fa-solid fa-trophy"></i> Sports</li>
<li><i class="fa-solid fa-lightbulb"></i> Learning</li>
<li><i class="fa-solid fa-shirt"></i> Fashion</li>
<li><i class="fa-solid fa-podcast"></i> Podcasts</li>
</ul>
</aside>
<main class="content">
<div class="categories">
<button class="active">All</button>
<button>Music</button>
<button>Mixes</button>
<button>User interface design</button>
<button>Graphic design</button>
<button>Computer Science</button>
</div>
<div class="video-grid">
<div class="video-card">
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="thumbnail">
</div>
<div class="video-card">
<img src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?w=600" alt="thumbnail">
</div>
<div class="video-card">
<img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600" alt="thumbnail">
</div>
<div class="video-card">
<img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=600" alt="thumbnail">
</div>
<div class="video-card">
<img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=600" alt="thumbnail">
</div>
<div class="video-card">
<img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600" alt="thumbnail">
</div>
<div class="video-card">
<img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=600" alt="thumbnail">
</div>
<div class="video-card">
<img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=600" alt="thumbnail">
</div>
<div class="video-card">
<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="thumbnail">
</div>
<div class="video-card">
<img src="https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?w=600" alt="thumbnail">
</div>
<div class="video-card">
<img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=600" alt="thumbnail">
</div>
<div class="video-card">
<img src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=600" alt="thumbnail">
</div>
</div>
</main>
</div>
</body>
  </html>
